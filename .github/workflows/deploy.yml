name: Deploy

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build the gallery
        run: bun run gallery:build
      - name: Install the deploy CLI
        working-directory: deploy
        run: bun install --frozen-lockfile

      - name: Check the build
        if: github.event_name == 'pull_request'
        working-directory: deploy
        run: npx --no-install cf deploy --mode ${{ github.base_ref == 'main' && 'production' || 'staging' }} --dry-run

      - name: Deploy staging
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        working-directory: deploy
        run: npx --no-install cf deploy --mode staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: deploy
        run: npx --no-install cf deploy --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
